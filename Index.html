<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presensi Siswa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 0 auto; padding: 16px; text-align: center; background:#f5f5f5; }
    h2 { margin-bottom: 4px; }
    select, button { font-size: 16px; padding: 10px; margin: 8px 0; width: 100%; border-radius: 8px; border: 1px solid #ccc; }
    #reader { width: 100%; margin-top: 12px; border-radius: 8px; overflow: hidden; }
    #result { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 18px; min-height: 24px; font-weight: bold; }
    .ok   { background: #d4edda; color: #155724; }
    .err  { background: #f8d7da; color: #721c24; }
    .warn { background: #fff3cd; color: #856404; }
    .idle { background: #e9ecef; color: #495057; }
  </style>
</head>
<body>
  <h2>📋 Presensi Siswa</h2>

  <!-- GANTI URL DI BAWAH INI dengan URL Web App hasil Deploy (diakhiri /exec) -->
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzeJDST-MpqgFDvtwNlTiUcYoiLkCwh3E_ReT61C_Ki_iXkjOGe7iYlcdk0sHSWbxqDGw/exec";
  </script>

  <select id="sesi">
    <option value="Pagi">🌅 Presensi Pagi</option>
    <option value="Zuhur">🕌 Presensi Shalat Zuhur</option>
  </select>
  <div id="reader"></div>
  <div id="result" class="idle">Arahkan kamera ke QR siswa</div>

  <script>
    let isProcessing = false;
    const resultDiv = document.getElementById('result');
    const sesiSelect = document.getElementById('sesi');

    function setResult(cls, text) {
      resultDiv.className = cls;
      resultDiv.textContent = text;
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      setResult('idle', 'Memproses...');

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari preflight CORS
        body: JSON.stringify({ id: decodedText, sesi: sesiSelect.value })
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          if (res.success) {
            setResult('ok', '✔ ' + res.nama + ' (' + res.kelas + ') - ' + res.status);
          } else {
            setResult(res.duplicate ? 'warn' : 'err', '✖ ' + res.message);
          }
          setTimeout(function () {
            isProcessing = false;
            setResult('idle', 'Arahkan kamera ke QR siswa berikutnya');
          }, 1800);
        })
        .catch(function (err) {
          setResult('err', 'Gagal terhubung ke server: ' + err.message);
          isProcessing = false;
        });
    }

    const html5QrCode = new Html5Qrcode('reader');
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    ).catch(function (err) {
      setResult('err', 'Tidak bisa membuka kamera: ' + err);
    });
  </script>
</body>
</html>
